name: test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/cache@v5
        with:
          path: build/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - name: Run linters
        run: |
          go run build/ci.go lint
          go run build/ci.go check_generate
          go run build/ci.go check_baddeps
      - name: Build and Test
        run: |
          go run build/ci.go install
          go run build/ci.go test -p 1
